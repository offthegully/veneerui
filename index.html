<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>veneer</title>
    <!--
      Anti-flash: synchronously apply the persisted theme's tokens to <html>
      before any stylesheet or module loads, so a returning user never sees the
      default theme flash before React mounts. Reads the same localStorage blob
      that src/theme/storage.ts writes (keep STORAGE_KEY in sync). Self-contained
      on purpose — it must not depend on any bundle.
    -->
    <script>
      (function () {
        try {
          var raw = localStorage.getItem('veneer.theme-library.v1');
          if (!raw) return;
          var lib = JSON.parse(raw);
          var themes = (lib && lib.themes) || [];
          var theme = null;
          for (var i = 0; i < themes.length; i++) {
            if (themes[i] && themes[i].id === lib.currentId) {
              theme = themes[i];
              break;
            }
          }
          if (!theme || !theme.tokens) return;
          var s = document.documentElement.style;
          for (var k in theme.tokens) {
            if (Object.prototype.hasOwnProperty.call(theme.tokens, k)) {
              s.setProperty('--' + k, theme.tokens[k]);
            }
          }
        } catch (e) {
          /* corrupt/unavailable storage — fall through to default theme */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
