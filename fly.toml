# Fly.io app config for the Veneer playground (veneerui.dev).
# Builds the repo-root Dockerfile and serves the static SPA with nginx.
app = "veneerui"
primary_region = "iad"

[build]

[http_service]
  internal_port = 8080
  force_https = true
  # Static site: let idle machines stop and cold-start on demand. Bump
  # min_machines_running to 1 if you want to eliminate the first-hit cold start.
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [http_service.concurrency]
    type = "requests"
    soft_limit = 200
    hard_limit = 250

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "5s"
    method = "GET"
    path = "/"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
