# nginx server block for the Veneer playground SPA. Copied to
# /etc/nginx/conf.d/default.conf in the runtime image. Listens on 8080 to match
# fly.toml's internal_port.

server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Hashed Vite build assets are content-addressed, so cache them hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # The published JSON Schema lives at /schemas/theme-v1.json. Serve it as JSON
    # with a modest cache so editors picking it up via "$schema" stay fresh.
    location /schemas/ {
        default_type application/json;
        add_header Cache-Control "public, max-age=3600";
    }

    # Single-page app: unknown paths fall back to the app shell.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Never cache the shell itself, or a deploy leaves clients on stale asset refs.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
