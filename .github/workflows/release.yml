name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write # push version commits, create tags / GitHub releases
  pull-requests: write # open/update the "Version Packages" PR
  id-token: write # OIDC for npm trusted publishing + provenance

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: 'https://registry.npmjs.org'

      # Trusted publishing + provenance require npm >= 11.5.1; the runner's
      # bundled npm may be older, so pin it. Stay on the v11 line: npm 12
      # changed `npm info --json` to emit an array, which breaks changesets'
      # published-version check — it sees no versions, "republishes" everything,
      # and already-published packages fail the run with "cannot publish over".
      # Revisit once @changesets/cli handles npm 12 output.
      - name: Update npm
        run: npm install -g npm@11

      - name: Install dependencies
        run: npm ci

      # With pending changesets, this opens/updates the "Version Packages" PR.
      # Once that PR is merged (no changesets left), it runs `npm run release`,
      # which builds everything then publishes the changed packages via OIDC
      # (no NPM_TOKEN needed) and creates git tags + GitHub releases.
      - name: Create release PR or publish
        uses: changesets/action@v1
        with:
          version: npm run version-packages
          publish: npm run release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
