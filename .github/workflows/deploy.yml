name: Deploy to Fly.io

on:
  push:
    branches:
      - main

# Never run two deploys against the same app at once.
concurrency:
  group: deploy-fly
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy playground
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: superfly/flyctl-actions/setup-flyctl@master

      # Builds the Dockerfile on Fly's remote builders (no local Node setup
      # needed) and releases it to the veneerui app.
      - name: Deploy
        run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
